<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DONGXIBIE · 个人工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#030303;
  --pnl-l:#060606;
  --pnl-c:#080808;
  --pnl-c2:#060606;
  --pnl-r:#030303;
  --pnl-rh:#070707;
  --pnl-rt:#000000;
  --edge:#2e2e2e;
  --bracket:#6e6e6e;
  --rule:#1a1a1a;
  --btn-line:#171717;
  --btn-on-line:#2a2a2a;
  --btn-on-fill:#131313;
  --chip-fill:#0e0e0e;
  --chip-line:#191919;
  --sort-line:#1c1c1c;
  --bill-line:#222222;
  --tag-line:#414141;
  --field:#030303;
  --sel:#101010;
  --sb-track:#141414;
  --sb-thumb:#9a9a9a;
  --green:#06ce8a;
  --red:#f52a2a;
  --red-live:#ea2020;
  --sans:'Instrument Sans','Inter',-apple-system,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--page-3);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--sans);color:var(--fg)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--page)}
#stage{position:relative;width:1586px;height:992px;transform-origin:center center;color:var(--fg);font-family:var(--sans);flex:none}
.t{line-height:1;white-space:pre;letter-spacing:0}
.mn{font-family:var(--mono);font-weight:400}
.sn{font-family:var(--sans);font-weight:400}
b{font-weight:400;color:var(--mute)}
em{font-style:normal}

/* ---------- 面板 ---------- */
.panel{position:absolute;top:85px;height:878px;border:1px solid var(--edge)}
#nav{left:27px;width:349px;background:var(--pnl-l)}
#queue{left:406px;width:650px;background:linear-gradient(180deg,var(--pnl-c) 0%,var(--pnl-c) 72%,var(--pnl-c2) 100%)}
#insp{left:1086px;width:472px;background:var(--pnl-r)}
.br{position:absolute;width:22px;height:22px;pointer-events:none}
.br.tl{left:-1px;top:-1px;border-left:1px solid var(--bracket);border-top:1px solid var(--bracket)}
.br.tr{right:-1px;top:-1px;border-right:1px solid var(--bracket);border-top:1px solid var(--bracket)}
.br.bl{left:-1px;bottom:-1px;border-left:1px solid var(--bracket);border-bottom:1px solid var(--bracket)}
.br.brr{right:-1px;bottom:-1px;border-right:1px solid var(--bracket);border-bottom:1px solid var(--bracket)}
hr{border:0;border-top:1px solid var(--rule)}

/* ---------- 动画 ---------- */
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.12}}
.livedot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red-live);box-shadow:0 0 8px 1px var(--glow-live);animation:pl 1.9s ease-in-out infinite}
.dot{position:absolute;width:10px;height:10px;border-radius:50%}
.dot.g{background:var(--green);box-shadow:0 0 7px 1px var(--glow-green)}
.dot.r{background:var(--red);box-shadow:0 0 7px 1px var(--glow-red)}
.dot.n{background:var(--dot-n)}
.cursor{position:absolute;width:9px;height:14px;background:var(--green);box-shadow:0 0 7px 1px var(--glow-green);animation:bl 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.cursor,.livedot{animation:none}}

/* ---------- 顶部状态条 ---------- */
#hdr-logo{position:absolute;left:27px;top:21px;width:11px;height:11px;background:#fff}
#hdr-brand{position:absolute;left:51px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--fg)}
#hdr-rule1{position:absolute;left:159px;top:16px;width:1px;height:21px;background:var(--line-2)}
#hdr-mod{position:absolute;left:186.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--fg-2)}
#hdr-scope{position:absolute;left:1009.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--dim)}
#hdr-scope-v{position:absolute;left:1080.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--fg);font-weight:600}
#hdr-rule2{position:absolute;left:1146px;top:16px;width:1px;height:21px;background:var(--line-2)}
#hdr-rec{position:absolute;left:1175.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--dim)}
#hdr-rec-v{position:absolute;left:1279.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--fg);font-weight:600}
#hdr-rec-t{position:absolute;left:1309.5px;top:20px;font-family:var(--mono);font-size:13.2px;color:var(--dim-2)}
#hdr-rule3{position:absolute;left:1377px;top:16px;width:1px;height:21px;background:var(--line-2)}
#hdr-live{position:absolute;left:1428px;top:22px;font-family:var(--mono);font-size:13.6px;color:var(--red-live);font-weight:500}

/* ---------- 左栏 ---------- */
#nav-sq{position:absolute;left:21px;top:27px;width:10px;height:10px;background:#fff}
#nav-title{position:absolute;left:42px;top:24px;font-family:var(--mono);font-size:15px;color:var(--fg)}
#nav-ok{position:absolute;left:266px;top:27px;font-family:var(--mono);font-size:11px;color:var(--dim)}
#nav-okdot{position:absolute;left:320px;top:28px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 7px 1px var(--glow-green)}
#nav-hr1{position:absolute;left:1px;top:63.5px;width:347px}
#nav-lbl{position:absolute;left:24px;top:91.68px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
#nav-name{position:absolute;left:24px;top:112px;font-size:30px;letter-spacing:-.016em;color:var(--fg)}
#nav-sh{position:absolute;left:24px;top:172px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#nav-cy{position:absolute;left:182px;top:172px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#nav-shv{position:absolute;left:24px;top:190px;font-size:19.5px}
#nav-cyv{position:absolute;left:182px;top:190px;font-size:19.5px}
#nav-hr2{position:absolute;left:1px;top:239px;width:347px}
#nav-ops{position:absolute;left:24px;top:267px;font-family:var(--mono);font-size:12.3px;color:var(--dim)}
.mrow{position:absolute;left:24px;right:20px;height:34px;display:flex;align-items:center;cursor:pointer;font-family:var(--mono);font-size:14.3px;color:var(--dim-2);transition:color .15s}
.mrow:hover{color:#9a9a9a}
.mrow.on{color:var(--fg)}
.mrow .mt{flex:1;white-space:pre}
.mrow .mc{font-family:var(--mono);font-size:12.5px;color:var(--dim-4)}
.mrow .md{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
#nav-foot{position:absolute;left:24px;top:812px;font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.9;white-space:pre}

/* ---------- 中栏 ---------- */
#q-title{position:absolute;left:30px;top:34px;font-size:33px;letter-spacing:.01em;color:var(--fg)}
#q-sub{position:absolute;left:30px;top:79.55px;font-family:var(--mono);font-size:13.8px;color:var(--dim)}
#q-sort{position:absolute;left:496px;top:65px;width:124px;height:31px;display:flex;align-items:center;justify-content:center;border:1px solid var(--sort-line);border-radius:2px;font-family:var(--mono);font-size:10.6px;color:var(--fg-2);cursor:pointer;transition:color .15s,border-color .15s;user-select:none}
#q-sort:hover{border-color:var(--mute);color:var(--fg)}
#q-field{position:absolute;left:30px;top:127px;width:590px;height:45px;background:var(--field);border:1px solid var(--rule);border-radius:3px}
#q-prompt{position:absolute;left:49.5px;top:139.87px;font-family:var(--mono);font-size:14.7px;color:var(--dim)}
#q-input{position:absolute;left:71.5px;top:130px;width:520px;height:39px;background:transparent;border:0;outline:0;font-family:var(--mono);font-size:14.7px;color:var(--fg-2)}
#q-input::placeholder{color:var(--dim)}
.frow{position:absolute;left:30px;width:590px;display:flex;align-items:center;gap:0}
.flabel{font-family:var(--mono);font-size:12.5px;color:var(--dim);width:80px}
.btn{height:31px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--btn-line);border-radius:2px;font-family:var(--mono);font-size:12.5px;color:var(--dim-3);cursor:pointer;transition:color .15s,border-color .15s,background-color .15s;user-select:none;background:transparent}
.btn:hover{color:var(--fg-2);border-color:#2a2a2a}
.btn.on{background:var(--btn-on-fill);border-color:var(--btn-on-line);color:var(--fg)}
#q-af{position:absolute;left:30px;top:376px;font-family:var(--mono);font-size:9.8px;color:var(--dim-2)}
#q-afv{position:absolute;left:120px;top:375.6px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#q-clr{position:absolute;left:543px;top:376px;font-family:var(--mono);font-size:9.8px;color:var(--dim-4);text-decoration:underline;cursor:pointer}
#q-hr1{position:absolute;left:30px;top:376px;width:590px}
#q-hr2{position:absolute;left:30px;top:431px;width:590px}
#q-hr3{position:absolute;left:30px;top:478.5px;width:590px}
#q-cols{position:absolute;left:31px;top:447.67px;font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:pre}
#q-cols span{position:absolute}
#q-hr4{position:absolute;left:30px;top:478.5px;width:590px}
#tscroll{position:absolute;left:1px;top:478.5px;width:648px;height:351px;overflow-y:auto;overflow-x:hidden}
#tscroll::-webkit-scrollbar{width:21px}
#tscroll::-webkit-scrollbar-track{background:var(--sb-track)}
#tscroll::-webkit-scrollbar-thumb{background:var(--sb-thumb);border:6px solid var(--sb-track)}
.trow{position:relative;width:627px;height:78px;border-bottom:1px solid var(--rule);cursor:pointer}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--sel)}
.trow.sel::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:#fff}
.trow .c{position:absolute;font-family:var(--mono)}
#q-foot1{position:absolute;left:30px;top:848.11px;font-family:var(--mono);font-size:12px;color:var(--dim)}
#q-foot2{position:absolute;left:538px;top:848.37px;font-family:var(--mono);font-size:11.7px;color:var(--dim)}
#q-hr5{position:absolute;left:30px;top:829.5px;width:590px}

/* ---------- 右栏 ---------- */
#ihead{position:absolute;left:0;top:0;width:472px;height:66px;background:var(--pnl-rh)}
#i-ico{position:absolute;left:21px;top:27px}
#i-title{position:absolute;left:45.5px;top:25.94px;font-family:var(--mono);font-size:14.5px;color:var(--fg-2)}
#i-tag{position:absolute;left:401px;top:22px;min-width:50px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 9px;border:1px solid var(--tag-line);border-radius:2px;font-family:var(--mono);font-size:11.5px;color:var(--fg)}
#i-hr{position:absolute;left:0;top:65.5px;width:470px}
#tfade,#ifade{position:absolute;height:26px;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,rgba(var(--fade-rgb),0),rgba(var(--fade-rgb),.94) 78%,rgba(var(--fade-rgb),.97))}
#ifade{left:1px;width:470px}
#tfade{left:1px}
#iscroll{position:absolute;left:1px;top:66px;width:470px;height:692px;overflow-y:auto;overflow-x:hidden}
#iscroll::-webkit-scrollbar{width:20px}
#iscroll::-webkit-scrollbar-track{background:var(--sb-track)}
#iscroll::-webkit-scrollbar-thumb{background:var(--sb-thumb);border:6px solid var(--sb-track)}
#icont{position:relative;width:450px;padding:29px 0 46px 29px}
#i-bill{display:inline-flex;align-items:center;height:38px;padding:0 13px;border:1px solid var(--bill-line);font-family:var(--mono);font-size:17px;color:var(--fg)}
#i-state{position:absolute;left:324px;top:30px;height:29px;padding:0 11px;display:flex;align-items:center;background:var(--strong-bg);border-radius:2px;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--strong-fg)}
#i-meta{margin-top:16px;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.85;white-space:pre-wrap}
#i-btxt{margin-top:18px;width:392px;font-size:19.5px;line-height:28px;letter-spacing:-.003em;color:var(--fg)}
#i-btxt p{margin-bottom:24px}
#i-code{margin-top:6px;width:392px;padding:16px 18px;border:1px solid var(--rule);background:var(--code-bg);font-family:var(--mono);font-size:12.6px;line-height:20px;color:var(--code-fg);white-space:pre;overflow-x:auto}
#i-code::-webkit-scrollbar{height:12px}
#i-code::-webkit-scrollbar-track{background:var(--sb-track)}
#i-code::-webkit-scrollbar-thumb{background:var(--code-sb)}
#i-empty{margin-top:22px;width:392px;height:300px;border:1px dashed var(--dash);display:flex;align-items:center;padding:0 26px;text-align:left;font-family:var(--mono);font-size:12.5px;color:#5a6068;line-height:2.35;white-space:pre}
#iterm{position:absolute;left:0;top:757px;width:470px;height:120px;background:var(--pnl-rt);border-top:1px solid var(--rule)}
.tline{position:absolute;left:14.5px;font-family:var(--mono);font-size:11.7px;color:var(--dim-6);white-space:pre}
#i-cursor{position:absolute;left:34px;top:89px}

/* ---------- 平板 / 手机：纵向堆叠，仍然可读 ---------- */
#mobar{display:none}
@media (max-width:768px){
  html,body{overflow:auto}
  #viewport{position:static;display:block;padding:14px 12px 40px}
  #stage{width:100%;height:auto;transform:none!important;display:flex;flex-direction:column;gap:12px}
  .panel{position:relative;left:auto!important;top:auto!important;width:100%!important;height:auto!important}
  #hdr-logo,#hdr-brand,#hdr-rule1,#hdr-mod,#hdr-scope,#hdr-scope-v,#hdr-rule2,#hdr-rec,#hdr-rec-v,#hdr-rec-t,#hdr-rule3,#hdr-live,.livedot{display:none}
  #mobar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--fg-2);padding:2px 2px 6px}
  #mobar .sq{width:9px;height:9px;background:#fff}
  #nav{height:auto!important;padding:8px}
  #nav-sq,#nav-title,#nav-ok,#nav-okdot,#nav-hr1,#nav-lbl,#nav-name,#nav-sh,#nav-cy,#nav-shv,#nav-cyv,#nav-hr2,#nav-ops,#nav-foot{position:static!important;display:block;margin-bottom:6px}
  #nav-name{font-size:22px!important}
  .mrow{position:static!important;height:38px}
  #queue,#insp{height:auto!important;min-height:0}
  #q-title,#q-sub,#q-sort,#q-field,#q-prompt,#q-input,#q-af,#q-afv,#q-clr,#q-hr1,#q-hr2,#q-hr3,#q-cols,#q-hr4,#q-foot1,#q-foot2,#q-hr5,#ihead,#i-hr,#iscroll,#iterm{position:static!important}
  #q-title{font-size:26px!important}
  #q-field{width:100%!important;margin:8px 0}
  #q-input{width:calc(100% - 90px)!important;position:static!important;padding:0 6px}
  #q-sort{width:120px;margin:6px 0}
  .frow{position:static!important;width:auto!important;flex-wrap:wrap;gap:6px;margin:6px 0}
  #tscroll{position:static!important;width:100%!important;height:auto!important;max-height:420px}
  .trow{width:100%!important}
  .trow .c{position:static!important;display:inline-block;margin:2px 10px 0 0}
  .trow .c.hide-sm{display:none}
  #q-cols{display:none}
  #icont{width:100%!important;padding:16px!important}
  #i-btxt{width:100%!important;font-size:17px!important;line-height:26px!important}
  #i-code,#i-empty{width:100%!important}
  #i-state{position:static!important;display:inline-flex;margin-left:10px}
  #iscroll{max-height:520px}
  #iterm{height:auto!important;padding:14px 16px 22px!important}
  .tline{position:static!important;display:block;white-space:pre-wrap}
  #i-cursor{position:static!important;display:inline-block;margin-top:8px}
  #theme-btn{position:static!important;margin-left:auto;flex:none}
  #q-foot1,#q-foot2{display:none}          /* 窄屏下页脚装饰文字会压到内容上 */
  /* 窄屏：筛选行与表格单元格要脱离内联绝对定位，否则会互相压字 */
  .frow{display:block!important}
  .frow > div{position:static!important;display:flex!important;flex-wrap:wrap;gap:6px;margin:2px 0}
  .trow{height:auto!important;padding:8px 10px 12px}
  .trow .sn{position:static!important;width:auto!important;display:inline-block;margin:2px 10px 6px 0;white-space:normal!important}
  #i-bill,#i-tag{position:static!important;display:inline-flex!important;vertical-align:middle}
  #i-bill{margin-right:10px}
  #i-bars .bars .b .n{width:96px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))!important;gap:8px}
  .quick{grid-template-columns:1fr 1fr!important;gap:8px}
  .ovw{position:static!important;padding:14px 4px 6px!important;gap:18px}
  .panel::before{display:none}
  #tfade,#ifade{display:none!important}
}

/* ==========================================================================
   柔和化 + 动效系统（覆盖在参考规格之上，几何尺寸不变）
   ========================================================================== */
:root{
  --accent:#e0b354;              /* 当前模块强调色，由 JS 切换 */
  --accent-soft:rgba(224,179,84,.16);
  --edge:#242932;
  --rule:#181c22;
  --glow-a:rgba(224,179,84,.19);
  --glow-b:rgba(96,140,255,.17);
  --accent-wash:rgba(224,179,84,.055);
  /* 面板底色由纯黑改为带一丝冷调的深色，边框对比度降低 */
  --page:#05060a;
  --pnl-l:#080b11;
  --pnl-c:#0a0d14;
  --pnl-c2:#06080d;
  --pnl-r:#06080d;
  --pnl-rh:#080b11;
  --pnl-rt:#04050a;
  --bracket:#7d8794;
  --chip-fill:#10141c;
  --chip-line:#1d222b;
  --btn-line:#1b2029;
  --btn-on-line:#2c333e;
  --btn-on-fill:#12161d;
  --sort-line:#20262f;
  --bill-line:#252c36;
  --tag-line:#3d4654;
  --field:#05070c;
  --sel:#101520;
  --sb-track:#141922;

  /* 语义色 token：深浅两套主题都靠它们切换 */
  --fg:#fff;            --fg-2:#e6e6e6;        --fg-3:#c9c9c9;
  --dim:#6b6b6b;        --dim-2:#4e4e4e;       --dim-3:#8d8d8d;
  --dim-4:#bdbdbd;      --dim-5:#6b7480;       --dim-6:#a4a4a4;   --mute:#3a3a3a;
  --line-2:#2a2a2a;     --dash:#2a2a2a;
  --hover:rgba(255,255,255,.014);   --hover-2:rgba(255,255,255,.03);
  --wash:rgba(255,255,255,.028);    --wash-thin:rgba(255,255,255,.012);
  --card-wash:rgba(255,255,255,.045);
  --strong-bg:#fafafa;  --strong-fg:#000;
  --code-bg:#020202;    --code-fg:#c9c9c9;     --code-sb:#4a4a4a;  --code-ink:rgba(0,0,0,.98);
  --track:#12161d;
  --panel-shadow:0 44px 96px -56px rgba(0,0,0,.98);
  --panel-inset:inset 0 1px 0 rgba(255,255,255,.04);
  --scan-c:rgba(255,255,255,.022);
  --fade-rgb:6,8,13;
  --brand-fg:#0c1017;
  --seg-1a:#0a9c6d; --seg-1b:#06ce8a;  --seg-2a:#41506a; --seg-2b:#5b6c86; --seg-3a:#1b2129; --seg-3b:#252d38;
  --page-2:#06070c;   --page-3:#030306;   --page-hi:#0b0e14;
  --bracket:rgba(110,110,110,.75);
  --dot-n:#4e4e4e;
  --shimmer:rgba(255,255,255,.07);
  --bar-hi:rgba(255,255,255,.14);
  --btn-shadow:rgba(0,0,0,.95);
  --glow-green:rgba(6,206,138,.45);  --glow-green-2:rgba(6,206,138,.3);
  --glow-red:rgba(245,42,42,.45);    --glow-live:rgba(234,32,32,.5);
}

/* ==========================================================================
   浅色主题：同一套 token 换一组取值（几何与动效完全一致）
   ========================================================================== */
html[data-theme="light"]{
  --page:#eef1f6;  --page-2:#f4f6fa;  --page-3:#e8ecf3;  --page-hi:#fbfcfe;
  --pnl-l:#ffffff; --pnl-c:#ffffff;  --pnl-c2:#fbfcfe;
  --pnl-r:#fbfcfe; --pnl-rh:#ffffff; --pnl-rt:#f6f8fc;
  --edge:#d7dde6;  --rule:#e9edf3;   --bracket:#9aa5b4;
  --chip-fill:#f2f5f9; --chip-line:#e3e9f1;
  --btn-line:#dde3ec;  --btn-on-line:#c3cee0; --btn-on-fill:#eef4ff;
  --sort-line:#dde3ec; --bill-line:#cfd8e4;   --tag-line:#b9c4d2;
  --field:#ffffff;     --sel:#eef2f8;
  --sb-track:#e9edf3;  --sb-thumb:#b6c0cd;

  --fg:#12161d;    --fg-2:#232a34;   --fg-3:#39424f;
  --dim:#6b7684;   --dim-2:#97a1af;  --dim-3:#7d8794;
  --dim-4:#55606e; --dim-5:#6b7684;  --dim-6:#5d6875;  --mute:#aab3c0;
  --line-2:#dde3ec;--dash:#cbd3de;
  --hover:rgba(18,22,29,.045);  --hover-2:rgba(18,22,29,.07);
  --wash:rgba(18,22,29,.03);    --wash-thin:rgba(18,22,29,.015);
  --card-wash:rgba(18,22,29,.035);
  --strong-bg:#1b2230;  --strong-fg:#fff;
  --code-bg:#f6f8fc;    --code-fg:#2b3340;  --code-sb:#b6c0cd;  --code-ink:rgba(15,20,28,.06);
  --track:#e8edf4;
  --panel-shadow:0 30px 64px -48px rgba(23,32,48,.30);
  --panel-inset:inset 0 1px 0 rgba(255,255,255,.9);
  --scan-c:rgba(18,22,29,.03);
  --fade-rgb:252,253,255;
  --brand-fg:#ffffff;

  --green:#0a9c6d; --red:#d63a3a;  --red-live:#d63a3a;
  --seg-1a:#12a97a; --seg-1b:#0a9c6d; --seg-2a:#a4b1c2; --seg-2b:#c2cbd8; --seg-3a:#c8d1dc; --seg-3b:#dde3ea;
  --dot-n:#b6c0cd;
  --shimmer:rgba(18,22,29,.05);
  --bar-hi:rgba(255,255,255,.55);
  --btn-shadow:rgba(23,32,48,.20);
  --glow-green:rgba(10,156,109,.35); --glow-green-2:rgba(10,156,109,.28);
  --glow-red:rgba(214,58,58,.32);    --glow-live:rgba(214,58,58,.40);
  --glow-a:rgba(224,179,84,.20); --glow-b:rgba(96,140,255,.20);
  --accent-wash:rgba(88,166,255,.05);
  --panel-shadow:0 26px 56px -44px rgba(23,32,48,.34);
}
html[data-theme="light"] .grain{mix-blend-mode:multiply;opacity:.05}
html[data-theme="light"] .panel{box-shadow:var(--panel-shadow), var(--panel-inset)}
html[data-theme="light"] #fade,html[data-theme="light"] #tfade,html[data-theme="light"] #ifade{
  background:linear-gradient(180deg,rgba(var(--fade-rgb),0),rgba(var(--fade-rgb),.95) 78%,rgba(var(--fade-rgb),.98))}
html[data-theme="light"] .br{border-color:var(--bracket)}
html[data-theme="light"] .btn:hover{color:var(--fg)}
html[data-theme="light"] #q-sort:hover{color:var(--fg)}
html[data-theme="light"] #hdr-logo{background:var(--fg)}
html[data-theme="light"] #nav-sq,html[data-theme="light"] #mobar .sq{background:var(--fg)}
html[data-theme="light"] .trow.sel::before{background:var(--accent)}
html[data-theme="light"] .pfbrand{color:var(--brand-fg)}
html[data-theme="light"] #icont a:not(.qc){color:#1f2a37;border-bottom-color:var(--accent-soft)}
html[data-theme="light"] #i-state{background:var(--strong-bg);color:var(--strong-fg)}
html[data-theme="light"] .livedot,html[data-theme="light"] .cursor{box-shadow:none}
html[data-theme="light"] .cursor{background:var(--green)}
html[data-theme="light"] .dot.g,html[data-theme="light"] .dot.r{box-shadow:none}

/* 鼠标跟随的柔光：很低的不透明度，只做氛围 */
#cursor-glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  pointer-events:none;z-index:6;opacity:0;transition:opacity .6s ease;will-change:transform;
  background:radial-gradient(circle,var(--accent-soft),transparent 62%)}
html[data-theme="light"] #cursor-glow{opacity:0!important;mix-blend-mode:multiply;display:none}

/* 卡片可做轻微 3D 倾斜 */
.qc,.stat{transform-style:preserve-3d;will-change:transform}
.qc{transition:transform .16s ease-out,border-color .25s ease,background-color .25s ease,box-shadow .3s ease}
.stat{transition:transform .16s ease-out,box-shadow .3s ease}

/* 顶栏主题切换键 */
#theme-btn{position:absolute;left:1494px;top:16px;width:62px;height:24px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--btn-line);border-radius:12px;background:var(--btn-on-fill);
  font-family:var(--mono);font-size:11.5px;color:var(--fg-2);cursor:pointer;
  transition:color .2s ease,border-color .25s ease,background-color .25s ease,transform .18s ease,box-shadow .25s ease}
#theme-btn:hover{color:var(--fg);border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 8px 18px -14px var(--btn-shadow), inset 0 0 18px -10px var(--accent-soft)}
#theme-btn:active{transform:translateY(0) scale(.97)}

/* 背景不再是纯黑：极淡的径向渐变 + 两个缓慢漂移的光斑 + 颗粒 */
#viewport{background:radial-gradient(120% 105% at 50% -10%,var(--page-hi) 0%,var(--page-2) 55%,var(--page-3) 100%);position:fixed;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:drift 75s ease-in-out infinite alternate}
.glow.a{width:760px;height:760px;left:-180px;top:-160px;background:radial-gradient(circle,var(--glow-a),transparent 66%)}
.glow.b{width:880px;height:880px;right:-240px;bottom:-280px;background:radial-gradient(circle,var(--glow-b),transparent 66%);animation-duration:95s;animation-direction:alternate-reverse}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(36px,-28px,0) scale(1.07)}
}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23g)'/></svg>");
  background-size:220px 220px;animation:grainShift 8s steps(6) infinite}
@keyframes grainShift{0%{background-position:0 0}100%{background-position:220px 110px}}

/* ---------- 面板：圆角、柔边、内高光、随强调色呼吸 ---------- */
.panel{border-radius:12px;border-color:var(--edge);
  box-shadow:var(--panel-shadow), var(--panel-inset);
  transition:border-color .5s ease, box-shadow .6s ease, opacity .22s ease, transform .22s ease}
#nav{background-color:var(--pnl-l);background-image:linear-gradient(180deg,var(--wash-thin),rgba(255,255,255,0) 34%)}
#queue{background-image:linear-gradient(180deg,var(--accent-wash) 0%,transparent 240px),linear-gradient(180deg,var(--pnl-c) 0%,var(--pnl-c) 70%,var(--pnl-c2) 100%)}
#insp{background-color:var(--pnl-r)}
.panel::after{content:'';position:absolute;inset:-1px;border-radius:12px;pointer-events:none;
  box-shadow:inset 0 0 70px -34px var(--accent-soft);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.br{border-color:var(--bracket)}

/* ---------- 入场：面板依次升起 + 顶栏元素落下 ---------- */
#stage:not(.ready) .panel{opacity:0;transform:translateY(16px) scale(.995)}
#stage.ready .panel{animation:panelIn .8s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--d,0) * 90ms)}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.995)}to{opacity:1;transform:none}}
#stage:not(.ready) > :not(.panel){opacity:0}
#stage.ready > :not(.panel){animation:hdIn .62s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--hdn,0) * 42ms + 90ms)}
@keyframes hdIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}

/* ---------- 模块切换：柔和交叉过渡 ---------- */
#stage.swapping #queue,#stage.swapping #insp{opacity:.35;transform:translateY(7px)}

/* ---------- 表格行：逐行淡入、悬停浮起、选中态带强调色光晕 ---------- */
.trow{border-bottom-color:var(--rule);transition:background-color .22s ease, transform .22s ease, box-shadow .3s ease}
/* 逐行淡入只在切换模块时播放，筛选/选中时不重播，避免闪烁 */
#tbody.anim .trow{animation:rowIn .52s cubic-bezier(.2,.72,.25,1) both;animation-delay:calc(var(--i,0) * 24ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.trow:hover{background:var(--hover);transform:translateX(2px)}
.trow.sel{box-shadow:inset 0 0 44px -22px var(--accent-soft)}
.trow.sel::before{background:var(--accent);box-shadow:0 0 14px var(--accent-soft);animation:barIn .45s cubic-bezier(.16,.84,.24,1) both}
@keyframes barIn{from{transform:scaleY(.2);opacity:.4}to{transform:scaleY(1);opacity:1}}
.trow .chip{border-radius:6px}

/* ---------- 按钮 / 输入 / 徽章：圆角 + 轻抬升 ---------- */
.btn{border-radius:6px;transition:color .2s ease,border-color .2s ease,background-color .2s ease,transform .18s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -16px var(--btn-shadow)}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 22px -10px var(--accent-soft),0 8px 20px -16px var(--btn-shadow)}
#q-field{border-radius:9px;transition:border-color .3s ease,box-shadow .35s ease}
#q-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q-sort{border-radius:7px}
#i-bill,#i-tag,#i-state{border-radius:6px}
#ihead{background:linear-gradient(180deg,var(--wash),rgba(255,255,255,0))}
#iterm{border-top-color:var(--rule);background:linear-gradient(180deg,var(--wash-thin),transparent)}
#i-code{border-radius:9px;border-color:var(--rule);box-shadow:inset 0 0 60px -34px var(--code-ink)}

/* ---------- 左栏导航：强调色指示条 + 缓慢掠过的高光 ---------- */
.mrow{border-radius:7px;transition:color .22s ease,background-color .28s ease,transform .2s ease;overflow:hidden}
.mrow:hover{transform:translateX(2px);background:var(--hover)}
.mrow.on{background:linear-gradient(90deg,var(--accent-soft),transparent 72%)}
.mrow.on::before{content:'';position:absolute;left:6px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;
  background:var(--accent);box-shadow:0 0 12px var(--accent);animation:barIn .45s cubic-bezier(.16,.84,.24,1) both}
.mrow.on::after{content:'';position:absolute;inset:0;border-radius:7px;
  background:linear-gradient(104deg,transparent 32%,var(--shimmer) 50%,transparent 68%);
  background-size:230% 100%;animation:sweep 5.2s ease-in-out infinite}
@keyframes sweep{0%{background-position:130% 0}58%,100%{background-position:-70% 0}}

/* ---------- 详情面板：内容分块淡入 ---------- */
#icont > *{animation:fadeUp .55s cubic-bezier(.2,.72,.25,1) both}
#icont > *:nth-child(1){animation-delay:.03s}
#icont > *:nth-child(2){animation-delay:.09s}
#icont > *:nth-child(3){animation-delay:.15s}
#icont > *:nth-child(4){animation-delay:.21s}
#i-btxt p{animation:fadeUp .46s cubic-bezier(.2,.72,.25,1) both}
#i-btxt p:nth-child(1){animation-delay:.04s}
#i-btxt p:nth-child(2){animation-delay:.09s}
#i-btxt p:nth-child(3){animation-delay:.14s}
#i-btxt p:nth-child(4){animation-delay:.19s}
#i-btxt p:nth-child(5){animation-delay:.24s}
#i-bars .b .n{color:var(--fg-2)}
/* 档案页 */
.pfcard{display:flex;align-items:center;gap:17px;border:1px solid var(--edge);border-radius:13px;padding:18px 21px;
  background:linear-gradient(180deg,var(--card-wash),var(--wash-thin))}
.pfbrand{width:58px;height:58px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:600;color:var(--brand-fg);background:linear-gradient(150deg,var(--accent),var(--accent-soft));
  box-shadow:0 10px 26px -16px var(--accent)}
.pfname{font-size:23px;color:var(--fg)}
.pfsub{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-top:8px}
.pfmeta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.9}
.pfmeta span{display:block;color:var(--dim-2)}
.kv .kvr{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--rule)}
.todo{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tchip{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px dashed var(--chip-line);border-radius:6px;padding:6px 11px}
.tnote{font-size:13.4px;color:var(--dim-2)}
.kv .kvr:last-child{border-bottom:0}
.kv .kk{width:96px;flex:none;font-family:var(--mono);font-size:12px;color:var(--dim)}
.kv .vv{font-size:15.2px;color:var(--fg-2)}
.kv.dim .vv{color:var(--dim)}
a.qc{text-decoration:none;display:block}
a.qc .qs{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#icont a:not(.qc){color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft);transition:border-color .2s}
#icont a:not(.qc):hover{border-bottom-color:var(--accent)}
#i-bars{margin-top:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- 中栏缓慢扫描的光带（提示"实时"） ---------- */
.scan{position:absolute;left:0;right:0;top:0;height:150px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--scan-c) 45%,transparent);animation:scan 12s linear infinite}
@keyframes scan{0%{transform:translateY(-160px)}100%{transform:translateY(920px)}}

/* ---------- 状态点：外扩光环 ---------- */
.livedot::after{content:'';position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--glow-live);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.55);opacity:.9}72%,100%{transform:scale(1.6);opacity:0}}
.dot.g,.dot.r{animation:dotPulse 3.4s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.72}}
.cursor{animation:bl 1.1s steps(1) infinite, cursorGlow 2.8s ease-in-out infinite}
@keyframes cursorGlow{0%,100%{box-shadow:0 0 7px 1px var(--glow-green)}50%{box-shadow:0 0 16px 3px var(--glow-green-2)}}

/* ---------- 总览模块的统计卡 / 条形 / 分段条 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{position:relative;border:1px solid var(--edge);border-radius:11px;padding:17px 18px 19px;overflow:hidden;
  background:linear-gradient(180deg,var(--wash),var(--wash-thin));
  animation:fadeUp .6s cubic-bezier(.2,.72,.25,1) both}
.stat:nth-child(2){animation-delay:.07s}
.stat:nth-child(3){animation-delay:.14s}
.stat .k{font-family:var(--mono);font-size:11px;color:var(--dim-3)}
.stat .n{font-family:var(--mono);font-size:40px;color:var(--fg);margin-top:10px;letter-spacing:-.015em;line-height:1.05}
.stat .u{font-family:var(--mono);font-size:11px;color:var(--dim-6);margin-left:4px}
.stat::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:var(--p,60%);
  background:linear-gradient(90deg,transparent,var(--accent));opacity:.85;animation:growX .95s cubic-bezier(.16,.84,.24,1) both}
@keyframes growX{from{width:0}to{width:var(--p,60%)}}
.sec{margin-top:22px}
.sec .h{font-family:var(--mono);font-size:11.5px;color:var(--dim-5);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.sec .h::after{content:'';flex:1;height:1px;background:var(--rule)}
.bars .b{display:flex;align-items:center;gap:11px;margin:9px 0}
.bars .b .n{width:150px;font-family:var(--mono);font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .b .t{flex:1;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.bars .b .t i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--bar-hi),var(--accent));
  animation:growX .95s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.bars .b .v{width:34px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--dim-3)}
.seg{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--track);margin:12px 0 11px}
.seg i{display:block;height:100%;animation:growX .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i,0) * 120ms)}
.legend{display:flex;gap:18px;font-family:var(--mono);font-size:11.5px;color:var(--dim-5);flex-wrap:wrap}
.legend span{display:flex;align-items:center}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.latest{margin-top:6px}
.latest .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);
  animation:fadeUp .55s cubic-bezier(.2,.72,.25,1) both;animation-delay:calc(var(--i,0) * 60ms + .1s)}
.latest .li:last-child{border-bottom:0}
.latest .li .d{font-family:var(--mono);font-size:11.5px;color:var(--dim-5);width:92px}
.latest .li .t{font-size:14.5px;color:var(--fg-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.latest .li .s{font-family:var(--mono);font-size:11px}

/* 总览：内容按整栏高度等距铺开 */
.ovw{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:26px 30px 24px}
.ovw .sec{margin-top:0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qc{border:1px solid var(--edge);border-radius:10px;padding:12px 15px;cursor:pointer;
  background:linear-gradient(180deg,var(--wash),var(--wash-thin));
  transition:transform .22s cubic-bezier(.2,.72,.25,1),border-color .25s ease,background-color .25s ease,box-shadow .3s ease}
.qc:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 16px 30px -22px var(--btn-shadow), inset 0 0 26px -14px var(--accent-soft)}
.qc:active{transform:translateY(-1px) scale(.985)}
.qc .qn{font-size:14.6px;color:var(--fg-2)}
.qc .qs{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.stat,.qc,.btn,.trow,.mrow{-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(0) scale(.975)}
.trow:active{background:var(--hover-2)}
#i-bars .sec:first-child{margin-top:0}
#i-bars .sec+.sec{margin-top:26px}

/* 面板顶边一道随模块变化的强调色描边 */
.panel::before{content:'';position:absolute;left:9%;right:9%;top:-1px;height:1px;pointer-events:none;border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--accent) 50%,transparent);opacity:.5;transition:opacity .5s ease,background .5s ease}

/* 关掉动效时只停动画，不改变任何元素本来的透明度：
   背景光斑与颗粒层是靠自身 opacity 才淡下去的，强行拉满会变成一片灰噪点 */
@media (prefers-reduced-motion:reduce){
  .glow,.grain,.scan,#tbody.anim .trow,#stage.ready .panel,#stage.ready > :not(.panel),
  .livedot,.livedot::after,.dot.g,.dot.r,.cursor,.mrow.on::after,.mrow.on::before,
  .stat,.stat::after,.bars .b .t i,.seg i,.latest .li,#icont > *,#i-btxt p,.panel::after,.trow.sel::before{
    animation:none!important}
}

</style>
</head>
<body>
<div id="viewport">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="grain"></div>
  <div id="stage">

    <!-- ===================== 顶部状态条 ===================== -->
    <div id="mobar"><span class="sq"></span><span>DONGXIBIE · 个人工作台</span><span style="color:var(--dim-2)">控制台 v1.0</span></div>
    <div id="hdr-logo"></div>
    <div id="hdr-brand" class="t">DONGXIBIE</div>
    <div id="hdr-rule1"></div>
    <div id="hdr-mod" class="t">MODULES</div>
    <div id="hdr-scope" class="t">范围：</div>
    <div id="hdr-scope-v" class="t">个人</div>
    <div id="hdr-rule2"></div>
    <div id="hdr-rec" class="t">记录：</div>
    <div id="hdr-rec-v" class="t">0</div>

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function hexA(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function setAccent(){
  const c = ACCENT[state.module] || '#e0b354';
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-soft', hexA(c, light ? .13 : .17));
  document.documentElement.style.setProperty('--accent-wash', hexA(c, light ? .05 : .055));
}
/** 数字跳动：切换模块时把顶栏计数与统计卡从旧值滚到新值 */
function countUp(el, to, pad){
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  const put = v => { el.textContent = String(v).padStart(pad,'0'); };
  if(REDUCED || from === to){ put(to); return; }
  const t0 = performance.now(), dur = 460;
  const step = t => {
    const p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1 - p, 3);
    put(Math.round(from + (to - from) * e));
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* 代码块逐段揭示：按长度定速，长度不同的片段都是约 0.7 秒写完 */
let typerTimer = null;
function typeInto(el, text){
  if(REDUCED){ el.textContent = text; return; }
  const total = text.length, per = Math.max(1, Math.ceil(total / 42));
  let i = 0;
  el.textContent = '';
  if(typerTimer) clearInterval(typerTimer);
  typerTimer = setInterval(()=>{
    i = Math.min(total, i + per);
    el.textContent = text.slice(0, i);
    if(i >= total){ clearInterval(typerTimer); typerTimer = null; }
  }, 16);
}

/** 卡片 3D 倾斜：鼠标在卡片内的位置决定倾斜方向 */
function bindTilt(root){
  if(REDUCED) return;
  root.querySelectorAll('.qc,.stat').forEach(el=>{
    el.addEventListener('mousemove', e=>{
      const r = el.getBoundingClientRect();
      const dx = (e.clientX - r.left)/r.width - .5, dy = (e.clientY - r.top)/r.height - .5;
      el.style.transform = `perspective(620px) rotateX(${(-dy*4.5).toFixed(2)}deg) rotateY(${(dx*5.5).toFixed(2)}deg) translateY(-3px)`;
    });
    el.addEventListener('mouseleave', ()=>{ el.style.transform = ''; });
  });
}

/** 深浅色主题：选择记在浏览器里，下次打开保持 */
const THEME_KEY = 'dongxibie-ops-theme';
function applyTheme(t){
  const light = t === 'light';
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  const b = document.getElementById('theme-btn');
  if(b) b.textContent = light ? '深色' : '浅色';
  try{ localStorage.setItem(THEME_KEY, light ? 'light' : 'dark'); }catch(e){}
  setAccent();   // 浅色下强调色的透明度要低一档，重算一次
}
(function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  applyTheme(saved);
  const b = document.getElementById('theme-btn');
  if(b) b.onclick = ()=> applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
})();

/** 入场动画播完后摘掉动画，否则 fill:both 会锁住 opacity/transform，切换过渡就失效了 */
let settled = false;
function settle(){
  if(settled) return;
  settled = true;
  try{ Array.prototype.forEach.call(document.getElementById('stage').children, el=>{ el.style.animation = 'none'; }); }catch(e){}
}
/** 切换模块：先让中栏右栏柔和退场，再换内容进场 */
let swapTimer = null, animTimer = null;
function switchModule(key){
  if(key === state.module) return;
  state.module = key; state.keyword = ''; state.filters = {};
  const inp = document.getElementById('q-input'); if(inp) inp.value = '';
  const stage = document.getElementById('stage'), tb = document.getElementById('tbody');
  if(REDUCED){ renderAll(); return; }
  settle();
  stage.classList.add('swapping');
  tb.classList.add('anim');
  clearTimeout(animTimer); animTimer = setTimeout(()=>tb.classList.remove('anim'), 950);
  clearTimeout(swapTimer);
  swapTimer = setTimeout(()=>{ renderAll(); fit(); stage.classList.remove('swapping'); }, 170);
}

function currentRows(){
  const sc = SCHEMA[state.module];
  let rows = sc.rows();
  sc.filters.forEach(f=>{
    const v = state.filters[f.key] || 'ALL';
    if(v==='ALL') return;
    rows = rows.filter(r=>f.map(r,v));
  });
  if(state.keyword){
    const k = state.keyword.toLowerCase();
    rows = rows.filter(r=>JSON.stringify(r).toLowerCase().includes(k));
  }
  if(state.asc) rows = rows.slice().reverse();
  return rows;
}

    box.textContent = '1 · 形态：纵向时间轴 / 横向里程环 / 阶梯式等级图\n2 · 内容：只放成长节点，还是合并项目与技术里程碑\n3 · 粒度：按年 / 按季度 / 按项目转段\n4 · 视觉：延续这套运维终端，还是换一套"陈列馆"质感\n5 · 交互：静态陈列 / 点击展开详情 / 滚动逐级点亮';
    document.getElementById('icont').appendChild(box);
  } else {
    bill.style.display = ''; stateEl.style.display = '';
    const item = currentItem();
    document.getElementById('i-tag').textContent = itemLabel(item);
    bill.textContent = itemLabel(item);
    const st = state.module==='projects' ? item.state : (state.module==='stack' ? item.state : 'VERIFIED');
    stateEl.textContent = STATE_ZH[st] || st;
    meta.textContent = state.module==='projects'
      ? `类型   ：${TYPE_ZH[item.type]||item.type}\n技术栈 ：${item.stack}\n更新   ：${item.updated}\n范围   ：${SCOPE_ZH[item.scope]||item.scope}`
      : state.module==='stack'
      ? `分类 ：${CAT_ZH[item.cat]||item.cat}\n等级 ：${bar(item.level)}\n起始 ：${item.since}\n用于 ：${item.used.join(' / ')}`
      : `语言 ：${LANG_ZH[item.lang]||item.lang}\n标签 ：${item.tags}\n添加 ：${item.added}`;
    if(state.module==='code'){
      body.innerHTML = `<p style="font-size:19px;line-height:27px">${esc(item.title)}</p><p style="font-size:17px;line-height:25px;color:var(--code-fg)">${esc(item.body)}</p>`;
      const box = document.createElement('div');
      box.id = 'i-code';
      document.getElementById('icont').appendChild(box);
      typeInto(box, item.code);
    } else {
      body.innerHTML = item.body.map(p=>`<p>${esc(p)}</p>`).join('');
    }
  }

  // 终端页脚
  const term = state.module==='overview'
    ? ['> 概览 个人工作台', `> 项目 ${PROJECTS.length} · 技术 ${TECH.length} · 片段 ${CODE.length}`,
       `> 仓库 ${REPOS.length} · 活动 ${ACTIVITY.length}`, '> 状态 全部模块在线']
    : state.module==='profile'
    ? ['> 档案 ' + PROFILE.handle, '> 品牌 ' + PROFILE.name, '> 仓库 ' + REPOS.length + ' 个',
       '> 待补 ' + PROFILE.todo.length + ' 项']
    : state.module==='activity'
    ? ['> 记录 ' + currentItem().label + ' · ' + currentItem().name,
       '> 来源 ' + MODULE_ZH[currentItem().kind] + '模块', '> 日期 ' + currentItem().date,
       '> 说明 ' + currentItem().note]
    : state.module==='repos'
    ? ['> 仓库 Dongxibie/' + currentItem().name, '> 语言 ' + currentItem().lang,
       '> 内容 ' + currentItem().size, '> 更新 ' + currentItem().upd]
    : state.module==='projects' ? currentItem().term
    : state.module==='stack' ? ['> 追踪 T-' + currentItem().id.slice(1) + ' · ' + currentItem().name,
        '> 等级 ' + bar(currentItem().level), '> 起始 ' + currentItem().since,
        '> 用于 ' + currentItem().used.length + ' 个项目']
    : state.module==='code' ? ['> 追踪 C-' + currentItem().id.slice(1) + ' · ' + currentItem().title,
        '> 语言 ' + (LANG_ZH[currentItem().lang]||currentItem().lang), '> 标签 ' + currentItem().tags, '> 状态 已校验']
    : ['> 追踪 T-000 · 时间线模块', '> 状态 保留', '> 待定 设计维度', '> 尚未接入数据'];
  document.getElementById('i-term').innerHTML = term.map((l,i)=>
    `<div class="tline" style="top:${13.87 + i*19}px">${esc(l).replace('&gt;','<b>&gt;</b>')}</div>`).join('');
  document.getElementById('iscroll').scrollTop = 0;
}

function currentItem(){
  const key = state.sel[state.module];
  const pools = { projects:PROJECTS, stack:TECH, code:CODE, activity:ACTIVITY, repos:REPOS };
  const pool = pools[state.module] || [];
  return pool.find(x=>x.id===key) || pool[0];
}

function renderAll(){
  setAccent();
  renderNav(); renderHeader(); renderQueue(); renderInspector();
}

/* ============================================================
   交互
   ============================================================ */
document.getElementById('q-input').addEventListener('input', e=>{ state.keyword = e.target.value.trim(); renderAll(); });
document.getElementById('q-sort').addEventListener('click', ()=>{ state.asc = !state.asc; renderAll(); });

// 滚轮：按缩放比例换算，滚得动的才 preventDefault
function bindWheel(el){
  el.addEventListener('wheel', e=>{
    const k = window.__k || 1;
    const prev = el.scrollTop;
    el.scrollTop += e.deltaY / k;
    if(el.scrollTop !== prev) e.preventDefault();
  }, {passive:false});
}
bindWheel(document.getElementById('tscroll'));
bindWheel(document.getElementById('iscroll'));

// 自适应缩放：桌面按 1586×992 等比缩放，多余宽/高让中栏右栏吃掉
function fit(){
  const stage = document.getElementById('stage');
  const w = window.innerWidth, h = window.innerHeight;
  if(window.matchMedia('(max-width:768px)').matches){
    stage.style.transform = 'none'; window.__k = 1;
    document.getElementById('queue').style.height = ''; document.getElementById('insp').style.height = '';
    ['tfade','ifade'].forEach(id=>{ document.getElementById(id).style.display = 'none'; });
    return;
  }
  const k = Math.min(w/1586, h/992);
  window.__k = k;
  // 自定义页（总览 / 档案）没有搜索与筛选行，内容上移并撑满整栏
  const ovw = !!(SCHEMA[state.module] && SCHEMA[state.module].custom);
  stage.style.transform = `scale(${k})`;
  const extraH = Math.max(0, h/k - 992), extraW = Math.max(0, w/k - 1586);
  document.getElementById('queue').style.height = (878 + extraH) + 'px';
  document.getElementById('insp').style.height = (878 + extraH) + 'px';
  document.getElementById('nav').style.height = (878 + extraH) + 'px';
  document.getElementById('tscroll').style.top = (ovw ? 190 : 478.5) + 'px';
  document.getElementById('tscroll').style.height = ((ovw ? 635 : 336.5) + extraH) + 'px';
  const tH = (ovw ? 635 : 336.5) + extraH;
  const tf = document.getElementById('tfade');
  tf.style.display = ''; tf.style.top = ((ovw ? 190 : 478.5) + tH - 26) + 'px'; tf.style.width = '648px';
  const iff = document.getElementById('ifade');
  iff.style.display = ''; iff.style.top = (66 + 692 + extraH - 26) + 'px';
  document.getElementById('iscroll').style.height = (692 + extraH) + 'px';
  document.getElementById('iterm').style.top = (757 + extraH) + 'px';
  document.getElementById('queue').style.width = (650 + extraW) + 'px';
  if(extraW>0){
    const t = document.getElementById('tscroll'), q = document.getElementById('queue');
    document.getElementById('tfade').style.width = (648 + extraW) + 'px';
    t.style.width = (648 + extraW) + 'px';
    ['q-field','q-hr1','q-hr2','q-hr3','q-hr4','q-hr5'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.style.width = (590 + extraW - 60) + 'px';
    });
    q.style.paddingRight = '0px';
  }
}
window.addEventListener('resize', ()=>{ fit(); });
window.addEventListener('orientationchange', ()=>setTimeout(fit,120));

/* 入场：顶栏元素依次落下，三块面板随后升起；即使脚本出错也不会留下空白 */
/* 鼠标跟随柔光：rAF 阻尼跟随，停下即停 */
(function cursorGlow(){
  const g = document.getElementById('cursor-glow');
  if(!g || REDUCED || window.matchMedia('(max-width:768px)').matches) return;
  let raf = null, cx = 0, cy = 0, tx = 0, ty = 0;
  const step = ()=>{
    cx += (tx - cx) * .13; cy += (ty - cy) * .13;
    g.style.transform = `translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
    raf = (Math.abs(tx-cx) > .6 || Math.abs(ty-cy) > .6) ? requestAnimationFrame(step) : null;
  };
  window.addEventListener('mousemove', e=>{
    tx = e.clientX; ty = e.clientY;
    if(!g.style.opacity || g.style.opacity === '0'){ g.style.opacity = '.5'; if(!raf){ cx = tx; cy = ty; raf = requestAnimationFrame(step); } }
    else if(!raf) raf = requestAnimationFrame(step);
  }, { passive:true });
  window.addEventListener('mouseleave', ()=>{ g.style.opacity = '0'; });
})();

(function boot(){
  const stage = document.getElementById('stage');
  try{
    let n = 0;
    Array.prototype.forEach.call(stage.children, el=>{
      if(!el.classList.contains('panel')) el.style.setProperty('--hdn', n++);
    });
  }catch(e){}
  const go = ()=>{ try{ renderAll(); }catch(e){} stage.classList.add('ready'); };
  if(REDUCED){ go(); return; }
  requestAnimationFrame(()=>requestAnimationFrame(go));
  setTimeout(()=>stage.classList.add('ready'), 700);   // 兜底
  setTimeout(settle, 1250);                            // 入场动画结束后解绑
})();
fit();
</script>
